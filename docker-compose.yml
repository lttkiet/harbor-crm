services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_crm_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crm}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://crm:local_crm_password@db:5432/crm}
      JWT_SECRET: ${JWT_SECRET-local-development-secret-change-before-deploy-please}
      AUTH_MODE: ${AUTH_MODE:-dev}
      APP_BIND_ADDRESS: ${APP_BIND_ADDRESS:-127.0.0.1}
      LAN_ADMIN_PASSWORD: ${LAN_ADMIN_PASSWORD:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run start:dev"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    build:
      context: ./web
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
      VITE_AUTH_MODE: ${AUTH_MODE:-dev}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:5173:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run dev"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  api_node_modules:
  web_node_modules:
